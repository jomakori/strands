name: Publish the image

# The image is a release artifact, not a build artifact: publishing on every
# push to main would make "the tag" mean nothing. A `v*` tag is a decision that
# this commit is shippable, and the manual trigger exists for the case where a
# tag turns out to be wrong and an existing commit needs re-shipping.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # `packages: write` is what GITHUB_TOKEN needs to push to ghcr.io; nothing
  # else is granted, so the workflow cannot touch the repository itself.
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/strands

jobs:
  publish:
    name: Build and push linux/amd64 + linux/arm64
    runs-on: ubuntu-24.04
    # `dx` and the server both compile under QEMU for the arm64 half, which is
    # the slow part of this job. If it starts to hurt, the fix is a native
    # arm64 runner and `runs-on` per platform, not a longer timeout.
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag scheme, in one place:
      #   v1.2.3  → 1.2.3
      #   any ref → sha-<short>
      #   a tag   → latest (and only a tag: `latest` must never point at an
      #             arbitrary commit on main)
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # `/healthz` reports this, so the running pod can be checked against
          # the commit that was tagged.
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the digest and the platform entries
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          # The digest is the only immutable name for what was just pushed: a
          # tag can be moved, so a deploy that records the digest can be
          # reproduced and one that records `latest` cannot.
          FIRST_TAG=$(echo "${TAGS}" | head -n1)
          MANIFEST=$(docker buildx imagetools inspect "${FIRST_TAG}" --format '{{json .Manifest}}')
          ROWS=$(jq -r '.manifests[] | "| \(.platform.os)/\(.platform.architecture) | `\(.digest)` |"' <<<"${MANIFEST}")
          PLATFORMS=$(jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(", ")' <<<"${MANIFEST}")

          {
            echo "### Published image"
            echo ""
            echo "- Digest: \`${DIGEST}\`"
            echo "- Commit: \`${COMMIT}\`"
            echo ""
            echo "| Tag |"
            echo "| --- |"
            for tag in ${TAGS}; do echo "| \`${tag}\` |"; done
            echo ""
            echo "| Platform | Digest |"
            echo "| --- | --- |"
            echo "${ROWS}"
            echo ""
            echo "Platforms: ${PLATFORMS}"
          } >> "${GITHUB_STEP_SUMMARY}"

          # Read back from the registry rather than trusted from the request:
          # this is what a puller actually gets, and it fails loudly if an
          # architecture silently dropped out of the manifest.
          echo "Published ${DIGEST} for ${PLATFORMS}"
