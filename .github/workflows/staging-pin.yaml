name: staging-pin

# There is one staging host and one pinned image, so exactly one writer decides
# both: this workflow. Every run recomputes the answer from the live set of open
# pull requests carrying the `preview` label, then writes the gate and the tag
# together in a single commit to jomakori/gke_GitOps:
#
#   newest labelled pull request  ->  enable_staging=true, tag=pr-<N>
#   no labelled pull request left ->  enable_staging=false, tag=0.0.0
#
# Nothing is written when the GitOps values already say what the set says, so a
# re-run (or a run for a label that does not matter) cannot churn the history.
#
# The label is applied to deploy staging — the splash copy links to the labelled
# pull request search. `preview-image.yml` also sets it after a successful push,
# but GitHub suppresses `labeled` events raised with this repository's own
# GITHUB_TOKEN, so that automatic label does not start this run; a label applied
# by a maintainer does.

on:
  pull_request:
    types: [labeled, unlabeled, closed]

permissions:
  contents: read
  pull-requests: read

# Serialized rather than cancelled: each run recomputes from the live set, so
# the last run to finish must decide from the set as it is now, not as it looked
# when it queued.
concurrency:
  group: staging-pin
  cancel-in-progress: false

env:
  GITOPS_REPO: jomakori/gke_GitOps
  LABEL: preview

jobs:
  pin:
    name: Point staging at the newest labelled pull request
    # A label other than the deploy label cannot change the answer.
    if: >-
      github.event.action == 'closed' ||
      github.event.label.name == 'preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository for the pin script
        uses: actions/checkout@v7

      # `state=open` is the whole rule: a closed pull request drops out of this
      # list, so `closed` needs no special case. Pages are slurped so the answer
      # never depends on which page a pull request landed on.
      - name: Collect the open pull requests carrying the label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: >-
          gh api --paginate --slurp
          "repos/${REPO}/pulls?state=open&per_page=100" > open.json

      - name: Pick the newest, and log the whole candidate set
        id: pick
        run: |
          set -euo pipefail
          jq --arg label "${LABEL}" '
            [ .[][] | select(any(.labels[]?; .name == $label)) ]
            | sort_by(.created_at, .number)
          ' open.json > labelled.json

          echo "open pull requests carrying '${LABEL}': $(jq length labelled.json)"
          jq -r '.[] | "  #\(.number) created \(.created_at)  \(.title)"' labelled.json

          if [ "$(jq length labelled.json)" -eq 0 ]; then
            echo "picked none: no open pull request carries the label, staging unpins"
            echo "pr=" >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          # Newest createdAt wins; the number breaks a tie so two pull requests
          # opened in the same second still resolve to the same one every run.
          pr="$(jq -r '.[-1].number' labelled.json)"
          echo "picked #${pr} (created $(jq -r '.[-1].created_at' labelled.json)) — newest of $(jq length labelled.json)"
          echo "pr=${pr}" >>"${GITHUB_OUTPUT}"

      - name: Pin the GitOps values
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          PR: ${{ steps.pick.outputs.pr }}
        run: |
          set -euo pipefail

          if [ -n "${PR}" ]; then
            message="chore(strands): staging pr-${PR}"
            wanted="enable_staging=true, tag=pr-${PR}"
          else
            message="chore(strands): unpin staging"
            wanted="enable_staging=false, tag=0.0.0"
          fi

          # Token rides in a header, not the clone URL, so a failed git command
          # cannot print it into the run log.
          auth="$(printf 'x-access-token:%s' "${GITOPS_TOKEN}" | base64 -w0)"
          gitops() { git -c http.extraheader="Authorization: Basic ${auth}" "$@"; }

          checkout="$(mktemp -d)"
          gitops clone --quiet --depth 1 \
            "https://github.com/${GITOPS_REPO}.git" "${checkout}"
          cd "${checkout}"

          # A release can pin production in the same file while this run waits,
          # so each attempt starts from whatever main now is and recomputes the
          # edit against it: a lost race retries, it never merges by hand.
          for attempt in 1 2 3 4 5; do
            gitops fetch --quiet --depth 1 origin main
            git reset --quiet --hard FETCH_HEAD

            python3 "${GITHUB_WORKSPACE}/.github/scripts/pin_staging.py" \
              "${checkout}" "${PR}"

            if git diff --quiet; then
              echo "already ${wanted}; nothing to commit"
              exit 0
            fi

            git -c user.name="strands-staging[bot]" \
                -c user.email="staging@users.noreply.github.com" \
                commit --quiet --all -m "${message}"
            echo "commit $(git rev-parse HEAD): ${message}"

            if gitops push --quiet origin HEAD:main; then
              echo "pushed to ${GITOPS_REPO} main: $(git rev-parse HEAD)"
              exit 0
            fi

            echo "push attempt ${attempt} lost the race; retrying from the new head"
            sleep $((attempt * 3))
          done

          echo "::error::could not push the staging pin after 5 attempts"
          exit 1
