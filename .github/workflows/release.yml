name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: npm install --no-audit --no-fund
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      - name: Pin production to this release
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0)"
          version="${tag#v}"
          gitops="$(mktemp -d)"
          git clone --depth 1 "https://x-access-token:${GITOPS_TOKEN}@github.com/jomakori/gke_GitOps.git" "$gitops"
          python3 .github/scripts/pin_strands.py "$gitops/apps/helm/values.yaml" "$version"
          cd "$gitops"
          if git diff --quiet; then
            echo "strands production already pinned to ${version}"
            exit 0
          fi
          git -c user.name="strands-release[bot]" -c user.email="release@users.noreply.github.com" \
            commit -q -am "chore(apps): pin strands prod to ${version}"
          git push -q origin HEAD:main
          echo "pinned strands production to ${version}"
