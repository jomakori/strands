name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install svu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download -R caarlos0/svu -p 'svu_*_linux_arm64.tar.gz' \
            -D "$RUNNER_TEMP/svu" --clobber
          tar -xzf "$RUNNER_TEMP"/svu/*.tar.gz -C /usr/local/bin svu
          svu --version

      - name: Tag the next version
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current="$(svu current)"
          next="$(svu next)"
          if [ "$current" = "$next" ]; then
            if git rev-parse -q --verify "refs/tags/$current" >/dev/null \
              && ! gh release view "$current" >/dev/null 2>&1; then
              echo "Resuming unpublished $current." >> "$GITHUB_STEP_SUMMARY"
              echo "version=${current#v}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "No releasable commits since $current."
            exit 0
          fi
          git tag "$next"
          git push origin "$next"
          echo "version=${next#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.tag.outputs.version != ''
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.tag.outputs.version != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        if: steps.tag.outputs.version != ''
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx build --push --platform linux/arm64 \
            --build-arg GIT_COMMIT="$GITHUB_SHA" \
            -t "ghcr.io/jomakori/strands:${VERSION}" \
            -t ghcr.io/jomakori/strands:latest .

      - name: Publish the release
        if: steps.tag.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: gh release create "v${VERSION}" --generate-notes --latest --verify-tag

  deploy:
    name: Deploy Release
    needs: build
    if: needs.build.outputs.version != ''
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4.0.1

      - name: Fetch the GitOps token
        id: pat
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          token="$(doppler secrets get GITHUB_TOKEN --plain --project devops --config ci)"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Checkout the GitOps repo
        uses: actions/checkout@v7
        with:
          repository: jomakori/gke_GitOps
          ref: main
          token: ${{ steps.pat.outputs.token }}
          path: gitops

      - name: Pin the production tag
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          yq -i '.strands.environments.production.tag = strenv(VERSION)' gitops/apps/helm/values.yaml
          cd gitops
          if git diff --quiet; then
            echo "strands production already pinned to ${VERSION}"
            exit 0
          fi
          git -c user.name="strands-release[bot]" \
            -c user.email="release@users.noreply.github.com" \
            commit -q -am "chore(apps): pin strands prod to ${VERSION}"
          git push -q origin HEAD:main
          echo "pinned strands production to ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
