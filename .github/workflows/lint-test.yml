name: lint-test

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting across the workspace
        run: cargo fmt --all --check

  clippy:
    name: Lint with warnings as errors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache the cargo registry and build output
        uses: Swatinem/rust-cache@v2

      # strands-web only compiles for wasm32-unknown-unknown, so it is linted
      # by the wasm-build job instead of here.
      - name: Run clippy across the host-target members
        run: cargo clippy --workspace --exclude strands-web --all-targets -- -D warnings

  test:
    name: Run workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Run the test suite
        run: cargo test --workspace --exclude strands-web

  schema:
    name: Verify migrations and user_id scoping on a clean DB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version "^0.8" --no-default-features --features postgres,rustls --locked

      - name: Run sqlx migrate run on a clean database
        run: sqlx migrate run --source migrations

      - name: Run the schema-shape acceptance test
        env:
          STRANDS_TEST_REQUIRE_DB: "1"
        run: cargo test --package strands-server --test schema_shape

      # Ticket T3: the isolation rules need a real database, so they run against
      # the same postgres:17 service as the schema check. They drive the real
      # router through the real login flow with a fake identity provider in
      # place of Google's network calls.
      - name: Run the auth isolation acceptance test
        # STRANDS_TEST_REQUIRE_DB makes an unreachable database a failure rather
        # than a skip — CI promises Postgres here, so a skip must not pass.
        env:
          STRANDS_TEST_REQUIRE_DB: "1"
        run: cargo test --package strands-server --test auth_isolation

      - name: Run the summary generation acceptance test
        env:
          STRANDS_TEST_REQUIRE_DB: "1"
        run: cargo test --package strands-server --test summary_generation

      # Ticket T16: ingest, lists and the KML export are DB-gated. Without this
      # step they would be skipped by the plain `cargo test` job above — which
      # has no DATABASE_URL — and the acceptance criteria would never run.
      - name: Run the Google Maps ingest acceptance test
        env:
          STRANDS_TEST_REQUIRE_DB: "1"
        run: cargo test --package strands-server --test gmaps_ingest
      # Ticket T10: judging needs real rows because idempotence is enforced by
      # the unique index on the ordered pair. The judge is a fake, so no test
      # here reaches the network or spends model tokens.
      - name: Run the link judging acceptance test
        env:
          STRANDS_TEST_REQUIRE_DB: "1"
        run: cargo test --package strands-server --test links

  wasm-build:
    name: Build the WASM bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DIOXUS_CLI_VERSION: "0.7.10"
      BUNDLE_SIZE_LIMIT_BYTES: "5242880"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain with the wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache the cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Install the dioxus CLI
        run: cargo install dioxus-cli --version "${DIOXUS_CLI_VERSION}" --locked

      - name: Build the release WASM bundle
        run: dx build --package strands-web --platform web --release

      - name: Locate the bundle and report its size
        id: bundle
        run: |
          PUBLIC_DIR=$(find target/dx -type d -path '*/release/web/public' | head -n1)
          if [ -z "${PUBLIC_DIR}" ]; then
            echo "::error::could not locate the dx web bundle under target/dx"
            exit 1
          fi
          BUNDLE_SIZE_BYTES=$(du -sb "${PUBLIC_DIR}" | cut -f1)
          echo "Bundle directory: ${PUBLIC_DIR}"
          echo "Bundle size: ${BUNDLE_SIZE_BYTES} bytes"
          echo "bundle_dir=${PUBLIC_DIR}" >> "${GITHUB_OUTPUT}"
          echo "bundle_size_bytes=${BUNDLE_SIZE_BYTES}" >> "${GITHUB_OUTPUT}"

      - name: Enforce the bundle size budget
        env:
          BUNDLE_SIZE_IN_BYTES: ${{ steps.bundle.outputs.bundle_size_bytes }}
        run: |
          if [ "${BUNDLE_SIZE_IN_BYTES}" -gt "${BUNDLE_SIZE_LIMIT_BYTES}" ]; then
            echo "::error::bundle is ${BUNDLE_SIZE_IN_BYTES} bytes, over the ${BUNDLE_SIZE_LIMIT_BYTES} byte budget"
            exit 1
          fi

      - name: Upload the WASM bundle
        uses: actions/upload-artifact@v7
        with:
          name: strands-web-wasm-bundle
          path: ${{ steps.bundle.outputs.bundle_dir }}
          if-no-files-found: error

  # Layout claims belong to the build, not to whoever last ran the app by hand:
  # this job drives a real Chromium against the release bundle and fails when a
  # viewport stops fitting or a capture stops matching the expected content.
  visual:
    name: Capture and verify the rendered UI
    needs: wasm-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    env:
      NODE_VERSION: "24"
      SERVE_PORT: "4173"
      STRANDS_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download the bundle built by wasm-build
        uses: actions/download-artifact@v7
        with:
          name: strands-web-wasm-bundle
          path: ${{ runner.temp }}/bundle

      - name: Install Node for the browser runner
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install the browser test dependencies
        run: npm ci --prefix e2e --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx --prefix e2e playwright install --with-deps chromium

      - name: Serve the bundle on a local port
        env:
          BUNDLE_DIR: ${{ runner.temp }}/bundle
        run: |
          python3 e2e/serve.py "${BUNDLE_DIR}" "${SERVE_PORT}" &
          HEALTH_URL="${STRANDS_BASE_URL}/"
          for attempt in $(seq 1 30); do
            if curl --silent --fail --output /dev/null "${HEALTH_URL}"; then
              echo "bundle answered after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the bundle never answered on ${STRANDS_BASE_URL}"
          exit 1

      - name: Run the browser specs at 360px and 1440px
        working-directory: e2e
        run: npx playwright test

      - name: Upload the captures and the JSON report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strands-ui-captures
          path: |
            e2e/captures
            e2e/test-results
          if-no-files-found: warn

      - name: Record the render result in the job summary
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const path = "e2e/test-results/results.json";
            if (!fs.existsSync(path)) {
              core.warning("no results.json — the specs did not start");
              return;
            }
            const report = JSON.parse(fs.readFileSync(path, "utf8"));
            const specs = [];
            const walk = (suite, projectName) => {
              for (const spec of suite.specs ?? []) {
                for (const test of spec.tests ?? []) {
                  specs.push({
                    project: projectName ?? test.projectName,
                    title: spec.title,
                    state: test.results.at(-1)?.status ?? "unknown",
                  });
                }
              }
              for (const child of suite.suites ?? []) walk(child, projectName);
            };
            for (const suite of report.suites ?? []) walk(suite, suite.title);
            const failed = specs.filter((spec) => spec.state !== "passed");
            const passed = specs.length - failed.length;
            const headline =
              `**Rendered UI** — ${passed}/${specs.length} checks ` +
              "passed against the release bundle.";
            const lines = [
              headline,
              "",
              "| Viewport | Check | Result |",
              "| --- | --- | --- |",
              ...specs.map(
                (spec) => `| ${spec.project} | ${spec.title} | ${spec.state} |`
              ),
              "",
              "Captures: artifact `strands-ui-captures` on this run.",
            ];
            await core.summary.addRaw(lines.join("\n")).write();
