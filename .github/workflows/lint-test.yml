name: lint-test

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting across the workspace
        run: cargo fmt --all --check

  clippy:
    name: Lint with warnings as errors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache the cargo registry and build output
        uses: Swatinem/rust-cache@v2

      # strands-web only compiles for wasm32-unknown-unknown, so it is linted
      # by the wasm-build job instead of here.
      - name: Run clippy across the host-target members
        run: cargo clippy --workspace --exclude strands-web --all-targets -- -D warnings

  test:
    name: Run workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Run the test suite
        run: cargo test --workspace --exclude strands-web

  schema:
    name: Verify migrations and user_id scoping on a clean DB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version "^0.8" --no-default-features --features postgres,rustls --locked

      - name: Run sqlx migrate run on a clean database
        run: sqlx migrate run --source migrations

      - name: Run the schema-shape acceptance test
        env:
          STRANDS_TEST_REQUIRE_DB: "1"
        run: cargo test --package strands-server --test schema_shape

      # Ticket T3: the isolation rules need a real database, so they run against
      # the same postgres:17 service as the schema check. They drive the real
      # router through the real login flow with a fake identity provider in
      # place of Google's network calls.
      - name: Run the auth isolation acceptance test
        # STRANDS_TEST_REQUIRE_DB makes an unreachable database a failure rather
        # than a skip — CI promises Postgres here, so a skip must not pass.
        env:
          STRANDS_TEST_REQUIRE_DB: "1"
        run: cargo test --package strands-server --test auth_isolation

      - name: Run the summary generation acceptance test
        env:
          STRANDS_TEST_REQUIRE_DB: "1"
        run: cargo test --package strands-server --test summary_generation

      # Ticket T16: ingest, lists and the KML export are DB-gated. Without this
      # step they would be skipped by the plain `cargo test` job above — which
      # has no DATABASE_URL — and the acceptance criteria would never run.
      - name: Run the Google Maps ingest acceptance test
        env:
          STRANDS_TEST_REQUIRE_DB: "1"
        run: cargo test --package strands-server --test gmaps_ingest
      # Ticket T10: judging needs real rows because idempotence is enforced by
      # the unique index on the ordered pair. The judge is a fake, so no test
      # here reaches the network or spends model tokens.
      - name: Run the link judging acceptance test
        env:
          STRANDS_TEST_REQUIRE_DB: "1"
        run: cargo test --package strands-server --test links

      # C2: these suites seed `connector_secrets` and read the token back
      # through the per-account derivation, so the v2 write path and the
      # `key_version` column are exercised against real rows, not mocks.
      - name: Run the connector secret acceptance tests
        env:
          STRANDS_TEST_REQUIRE_DB: "1"
        run: cargo test --package strands-server --test connector_registry --test photos_picker

      # C3: staging demo mode. The boot test needs Postgres because the demo
      # account and its content are seeded at startup, and the seed-idempotence
      # test is a `--lib` test that also skips without DATABASE_URL — so both run
      # here rather than in the plain `cargo test` job above.
      - name: Run the staging demo mode acceptance tests
        env:
          STRANDS_TEST_REQUIRE_DB: "1"
        run: cargo test --package strands-server --test demo_mode

      - name: Run the demo seeding idempotence test
        env:
          STRANDS_TEST_REQUIRE_DB: "1"
        run: cargo test --package strands-server --lib "demo::tests"

      # B1: the connect-state table and the token columns are DB-gated lib tests.
      # Without this step they would be skipped by the plain `cargo test` job,
      # which has no DATABASE_URL, and the migration would never be exercised on
      # a real Postgres — this job's `sqlx migrate run` above only proves it
      # applies, not that the row round-trips.
      - name: Run the connector OAuth state tests
        env:
          STRANDS_TEST_REQUIRE_DB: "1"
        run: cargo test --package strands-server --lib "oauth::tests"

      # B2: the connect and callback routes are DB-gated lib tests — they write
      # the state row, seal the token and read it back — so they run here, where
      # Postgres exists, and never skip silently in the job above.
      - name: Run the Google Photos connect tests
        env:
          STRANDS_TEST_REQUIRE_DB: "1"
        run: cargo test --package strands-server --lib "connectors::photos_connect::tests"

  wasm-build:
    name: Build the WASM bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DIOXUS_CLI_VERSION: "0.7.10"
      # 2.5 MiB, measured on the gzip of the release wasm — the bytes a browser
      # actually downloads. scripts/wasm-budget.sh is the gate.
      WASM_GZIP_BUDGET_BYTES: "2621440"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain with the wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache the cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Install the dioxus CLI
        run: cargo install dioxus-cli --version "${DIOXUS_CLI_VERSION}" --locked

      - name: Build the release WASM bundle
        run: dx build --package strands-web --platform web --release

      - name: Stage the release wasm the browser downloads
        id: bundle
        run: |
          PUBLIC_DIR=$(find target/dx -type d -path '*/release/web/public' | head -n1)
          if [ -z "${PUBLIC_DIR}" ]; then
            echo "::error::could not locate the dx web bundle under target/dx"
            exit 1
          fi
          # dx leaves the wasm of every earlier build beside the new one, so take
          # the newest — that is the file index.html's module loads.
          WASM=$(find "${PUBLIC_DIR}" -maxdepth 2 -name 'strands-web*.wasm' -type f -printf '%T@ %p\n' | sort -rn | head -n1 | cut -d' ' -f2-)
          if [ -z "${WASM}" ]; then
            echo "::error::the bundle at ${PUBLIC_DIR} carries no strands-web*.wasm"
            exit 1
          fi
          mkdir -p artifacts
          cp "${WASM}" artifacts/strands-web.wasm
          echo "Bundle directory: ${PUBLIC_DIR}"
          echo "Release wasm: ${WASM} ($(wc -c <"${WASM}" | tr -d ' ') bytes)"
          echo "bundle_dir=${PUBLIC_DIR}" >>"${GITHUB_OUTPUT}"

      - name: Enforce the wasm gzip budget
        # The table is the record of what we measured, so prove it reached the job
        # summary instead of assuming the write path works. The budget verdict
        # keeps its own exit code: over budget still fails, summary or not.
        run: |
          status=0
          scripts/wasm-budget.sh artifacts || status=$?
          grep -q 'WASM gzip budget' "${GITHUB_STEP_SUMMARY}" || {
            echo "::error::the budget table never reached \$GITHUB_STEP_SUMMARY"
            exit 1
          }
          exit "${status}"

      - name: Upload the WASM bundle
        uses: actions/upload-artifact@v7
        with:
          name: strands-web-wasm-bundle
          path: ${{ steps.bundle.outputs.bundle_dir }}
          if-no-files-found: error

  # Layout claims belong to the build, not to whoever last ran the app by hand:
  # this job drives a real Chromium against the release bundle and fails when a
  # viewport stops fitting or a capture stops matching the expected content.
  visual:
    name: Capture and verify the rendered UI
    needs: wasm-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      NODE_VERSION: "24"
      SERVE_PORT: "4173"
      STRANDS_BASE_URL: http://127.0.0.1:4173
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download the bundle built by wasm-build
        uses: actions/download-artifact@v7
        with:
          name: strands-web-wasm-bundle
          path: ${{ runner.temp }}/bundle

      - name: Install Node for the browser runner
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install the browser test dependencies
        run: npm ci --prefix e2e --no-audit --no-fund

      - name: Install Chromium for Playwright
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The runner's Ubuntu mirror flakes often enough to fail whole runs on a font package.
          # The browser is what the capture needs, so system deps get three attempts and, if the
          # mirror stays unreachable, the browser alone goes in — glyph substitution is a smaller
          # loss than a red check that says nothing about the UI.
          for attempt in 1 2 3; do
            npx --prefix e2e playwright install --with-deps chromium && exit 0
            echo "system deps attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          echo "::warning::system deps unavailable, installing Chromium without them"
          npx --prefix e2e playwright install chromium

      - name: Serve the bundle on a local port
        env:
          BUNDLE_DIR: ${{ runner.temp }}/bundle
        run: |
          python3 e2e/serve.py "${BUNDLE_DIR}" "${SERVE_PORT}" &
          HEALTH_URL="${STRANDS_BASE_URL}/"
          for attempt in $(seq 1 30); do
            if curl --silent --fail --output /dev/null "${HEALTH_URL}"; then
              echo "bundle answered after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the bundle never answered on ${STRANDS_BASE_URL}"
          exit 1

      # Accessibility is part of the render claim: the score comes from axe plus the computed
      # contrast and keyboard passes in tests/a11y.spec.ts, at both viewports. The threshold
      # and the measurements live in that spec; this step only reports and gates on them.
      - name: Enforce accessibility >= 95 on both views
        working-directory: e2e
        run: |
          run_status=0
          npx playwright test tests/a11y.spec.ts --reporter=line || run_status=$?
          summary_status=0
          node scripts/a11y-summary.mjs || summary_status=$?
          if [ "${run_status}" -ne 0 ]; then
            echo "::error::accessibility is below the threshold; the job summary lists every failing check"
            exit "${run_status}"
          fi
          exit "${summary_status}"

      - name: Run the browser specs at 360px and 1440px
        working-directory: e2e
        run: npx playwright test

      - name: Upload the captures and the JSON report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strands-ui-captures
          path: |
            e2e/captures
            e2e/test-results
            e2e/a11y
          if-no-files-found: warn

      - name: Record the render result in the job summary
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const path = "e2e/test-results/results.json";
            if (!fs.existsSync(path)) {
              core.warning("no results.json — the specs did not start");
              return;
            }
            const report = JSON.parse(fs.readFileSync(path, "utf8"));
            const specs = [];
            const walk = (suite, projectName) => {
              for (const spec of suite.specs ?? []) {
                for (const test of spec.tests ?? []) {
                  specs.push({
                    project: projectName ?? test.projectName,
                    title: spec.title,
                    state: test.results.at(-1)?.status ?? "unknown",
                  });
                }
              }
              for (const child of suite.suites ?? []) walk(child, projectName);
            };
            for (const suite of report.suites ?? []) walk(suite, suite.title);
            const failed = specs.filter((spec) => spec.state !== "passed");
            const passed = specs.length - failed.length;
            const headline =
              `**Rendered UI** — ${passed}/${specs.length} checks ` +
              "passed against the release bundle.";
            const lines = [
              headline,
              "",
              "| Viewport | Check | Result |",
              "| --- | --- | --- |",
              ...specs.map(
                (spec) => `| ${spec.project} | ${spec.title} | ${spec.state} |`
              ),
              "",
              "Captures: artifact `strands-ui-captures` on this run.",
            ];
            await core.summary.addRaw(lines.join("\n")).write();
