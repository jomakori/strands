[package]
name = "strands-connector-photos"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
# The picker tests drive a throwaway HTTP server on localhost: the client under
# test is the real one, so it needs a real socket to talk to.
tokio = { version = "1", features = ["macros", "net", "io-util", "rt-multi-thread"] }
