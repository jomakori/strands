[package]
name = "strands-web"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
dioxus = { version = "0.7", features = ["web", "router"] }
futures = "0.3"
gloo-net = "0.6"
# The WhatsApp row polls the link status while it is mounted (T28); this is the
# sleeping half of that loop, already in the lock file via dioxus' own graph.
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
strands-api-types = { path = "../api-types" }
strands-keymap = { path = "../keymap" }
uuid = { version = "1", features = ["serde", "v5"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "Window",
] }

[features]
default = ["web"]
web = ["dioxus/web"]
