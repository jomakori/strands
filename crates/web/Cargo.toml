[package]
name = "strands-web"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
dioxus = { version = "0.7", features = ["web", "router"] }
gloo-net = "0.6"
serde = { version = "1", features = ["derive"] }
strands-api-types = { path = "../api-types" }
strands-keymap = { path = "../keymap" }
uuid = { version = "1", features = ["serde", "v5"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Location",
    "Window",
] }

[features]
default = ["web"]
web = ["dioxus/web"]
