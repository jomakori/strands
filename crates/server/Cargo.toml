[package]
name = "strands-server"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "strands-server"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "migrate",
  "macros",
  "chrono",
  "uuid",
] }
strands-api-types = { path = "../api-types" }
strands-connector-photos = { path = "../connector-photos" }
strands-core = { path = "../core" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
uuid = { version = "1", features = ["v4"] }
whatsapp-rust = { version = "0.7", default-features = false, features = [
  "tokio-transport",
  "tokio-runtime",
  "tokio-native",
  "ureq-client",
  # NOT "sqlite-storage": it pins libsqlite3-sys ^0.37 while sqlx brings 0.30,
  # and cargo allows one package per `links = "sqlite3"` in a workspace.
] }

[dev-dependencies]
# KML well-formedness is asserted by parsing it, not by matching strings.
quick-xml = "0.37"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
